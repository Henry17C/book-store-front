<div class="w-full min-h-screen bg-white">
  <!-- 1. Los 3 observables en un solo objeto 'vm' (ViewModel) -->
  @if (
    {
      newReleases: newReleases$ | async,
      bestSellers: bestSellers$ | async,
      recommended: recommended$ | async,
    };
    as vm
  ) {
    <!-- 2. Verificar que los 3 ya hayan devuelto datos (no null) -->
    @if (vm.newReleases && vm.bestSellers && vm.recommended) {
      <section class="max-w-8xl mx-auto px-4 md:px-8 mt-10">
        <app-book-carousel title="Novedades" categoryId="NEW_RELEASES" [books]="vm.newReleases" />

        <app-book-carousel
          title="Los Más Vendidos"
          categoryId="BEST_SELLERS"
          [books]="vm.bestSellers"
        />

        <app-book-carousel
          title="Recomendados para ti"
          categoryId="RECOMMENDED"
          [books]="vm.recommended"
        />
      </section>
    } @else {
      <!-- 3. Pantalla de carga mientras esperamos al backend -->
      <div class="flex items-center justify-center min-h-[70vh]">
        <app-loader text="Preparando tu catálogo..."></app-loader>
      </div>
    }
  }
</div>
