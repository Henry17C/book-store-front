<header class="bg-sky-700 flex flex-row p-4 justify-between items-center">
  <a [routerLink]="['/']">
    <img src="assets/libris-white.svg" alt="Libris logo" class="w-16 h-auto md:w-24 lg:w-32" />
  </a>

  <div class="hidden md:flex grow mx-6">
    <app-search-bar class="w-full pl-20 pr-20" (click)="isSearchOpen = true" />
  </div>

  <app-header-actions />

  @if (isSearchOpen) {
      <app-catalog-search-modal (closeModal)="isSearchOpen = false" />
    }
</header>
